name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Operator boundary and audit tests
        run: |
          python agent/operator/test_operator.py
          node --test agent/operator/review-gate.test.mjs
      - name: Validate proposal diff and append-only memory
        env:
          OPERATOR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run agent:guard -- --mode evolution-proposal --base "$OPERATOR_BASE_SHA"
      - name: Validate content
        run: npm run content:audit:links
      - name: Lint
        run: npm run lint
      - name: Build and test
        run: npm test
# This job validates a proposal, never grants permission to merge or deploy.
# Require BOTH verify and operator-owner-approval in the main branch rules.
# The approval workflow runs from trusted base and publishes a status on exact HEAD.
