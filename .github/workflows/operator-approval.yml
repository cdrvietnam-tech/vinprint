name: Operator owner approval
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: operator-approval-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  approval:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted base only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: agent/operator
      - name: Check owner approval for current head
        uses: actions/github-script@v7
        with:
          script: |
            const { runGate } = await import(`${process.env.GITHUB_WORKSPACE}/agent/operator/review-gate.mjs`);
            const number = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.head.sha, context: 'operator-owner-approval', state: 'pending', description: 'Checking exact-version owner approval' });
            let result;
            try { result = await runGate({ github, context, core }); }
            catch (e) { result = { approved: false, headSha: pr.head.sha, reason: 'Approval verification failed' }; }
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: result.headSha, context: 'operator-owner-approval', state: result.approved ? 'success' : 'failure', description: result.reason.slice(0, 140) });
            if (!result.approved) core.setFailed(result.reason);
